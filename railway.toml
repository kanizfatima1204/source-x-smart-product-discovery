[build]
builder = "NIXPACKS"
buildCommand = "composer install --no-dev --optimize-autoloader --no-interaction && npm ci --include=dev && npm run build"

[deploy]
startCommand = "bash railway/start.sh"
healthcheckPath = "/up"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
